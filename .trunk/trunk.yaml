version: 0.1
cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
lint:
  disabled:
    - pyright
    - yamllint
  enabled:
    - ty@0.0.1-alpha.10
    - pre-commit-hooks@5.0.0
    - prettier@3.5.3
    - black@25.1.0
    - snyk@1.1295.0
    - trivy@0.63.0
    - markdown-link-check@3.13.7
    - gitleaks@8.27.2
    - actionlint@1.7.7
    - bandit@1.8.3
    - checkov@3.2.441
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.45.0
    - renovate@40.53.1
    - ruff@0.11.13
    - taplo@0.9.3
    - trufflehog@3.89.1
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
