version: 0.1
cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
lint:
  disabled:
    - black
    - pyright
    - yamllint
    - isort
  enabled:
    - ty@0.0.1-alpha.10
    - pre-commit-hooks@5.0.0
    - prettier@3.5.3
    - snyk@1.1295.0
    - trivy@0.63.0
    - gitleaks@8.27.2
    - actionlint@1.7.7
    - bandit@1.8.3
    - checkov@3.2.439
    - git-diff-check
    - hadolint@2.12.1-beta
    - renovate@40.48.5
    - ruff@0.11.13
    - trufflehog@3.89.0
actions:
  enabled:
    - trunk-check-pre-push-always
    - trunk-check-pre-commit
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
