version: 0.1
cli:
  version: 1.25.0
  shell_hooks:
    enforce: true
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
    - id: configs
      ref: v1.1.2
      uri: https://github.com/trunk-io/configs
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
lint:
  enabled:
    - trufflehog-git@3.92.3
    - pre-commit-hooks@5.0.0
    - trivy@0.68.1
    - yamlfmt@0.20.0
    - gitleaks@8.30.0
    - actionlint@1.7.9
    - bandit@1.9.2
    - checkov@3.2.495
    - git-diff-check
    - hadolint@2.14.0
    - markdownlint@0.47.0
    - renovate@42.52.8
    - ruff@0.14.9:
        commands:
          - lint
          - format
    - taplo@0.10.0:
        commands:
          - lint
          - format
    - trufflehog@3.92.3
    - yamllint@1.37.1
  disabled:
    - prettier
    - black
    - mypy
    - pylint
    - isort
actions:
  enabled:
    - commitizen
    - trufflehog-pre-commit
    - uv-lock
    - uv-sync
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
    - trunk-check-pre-commit
    - ensure-tag-matches-version
  definitions:
    - id: ensure-tag-matches-version
      triggers:
        - git_hooks:
            - pre-push
      run: python git_tag.py
      runtime: python
      run_from: .trunk/utils
      packages_file: .trunk/utils/requirements.txt
