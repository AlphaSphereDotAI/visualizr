[project]
name = "visualizr"
description = "Video Generator part of the Chatacter Backend"
version = "0.1.0"
readme = "README.md"
requires-python = "~=3.10"
dependencies = [
	"espnet>=202412",
	"gfpgan>=1.3.8",
	"gradio[mcp]>=5.34.0",
	"librosa>=0.9.2",
	"loguru>=0.7.3",
	"moviepy>=1.0.3",
	"python-speech-features>=0.6",
	"pytorch-lightning>=2.5.3",
	"realesrgan>=0.3.0",
	"spaces>=0.37.0",
	"torch>=2.6.0",
	"torchaudio>=2.6.0",
	"torchmetrics>=1.7.1",
	"torchvision>=0.21.0",
	"tqdm>=4.67.1",
	"transformers>=4.52.2",
]

[project.scripts]
visualizr = "visualizr.__main__:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

[dependency-groups]
dev = [
	"huggingface-hub[cli,hf-transfer]>=0.33.0",
	"ruff>=0.12.0",
	"ty>=0.0.1a10",
	"watchfiles>=1.0.5",
]

[tool.uv.sources]
torch = [
	{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
	{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
	{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
