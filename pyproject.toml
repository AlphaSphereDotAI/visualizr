[project]
name = "visualizr"
version = "0.0.1"
description = "Video Generator part of the Chatacter Backend"
readme = "README.md"
authors = [
    { name = "Mohamed Hisham Abdelzaher", email = "mohamed.hisham.abdelzaher@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["anitalker", "video"]
dependencies = [
    "espnet>=202207",
    "gradio[mcp]>=5.43.1",
    "huggingface-hub[hf-xet]>=0.34.4",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "moviepy>=2.2.1",
    "new-basicsr>=1.0.0",
    "numba>=0.61.2",
    "python-speech-features>=0.6",
    "pytorch-lightning>=2.5.3",
    "realesrgan-optimized>=0.3.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.55.4",
]
classifiers = [
    'Environment :: GPU :: NVIDIA CUDA :: 12.4',
    'Programming Language :: Python :: 3',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

[project.urls]
#Homepage = "https://example.com"
#Documentation = "https://readthedocs.org"
Repository = "https://github.com/AlphaSphereDotAI/visualizr.git"
Issues = "https://github.com/AlphaSphereDotAI/visualizr/issues"
Twitter = "https://x.com/AlphaSphereAI"

[project.scripts]
visualizr = "visualizr.__main__:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "pytest-emoji>=0.2.0",
    "pytest-md>=0.2.0",
    "pytest-mergify>=2025.8.20.1",
    "uv-build>=0.8.13",
]
