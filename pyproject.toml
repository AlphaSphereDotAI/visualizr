[project]
name = "visualizr"
description = "Video Generator part of the Chatacter Backend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10.0, <3.11"
dependencies = [
    "espnet>=202412",
    "gradio[mcp]>=5.34.0",
    "huggingface-hub[hf-xet]>=0.33.0",
    "loguru>=0.7.3",
    "moviepy>=1.0.3",
    "python-speech-features>=0.6",
    "pytorch-lightning>=2.5.1.post0",
    "realesrgan>=0.3.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.52.2",
]

[project.scripts]
visualizr = "visualizr.__main__:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

[dependency-groups]
dev = ["ruff>=0.12.0", "ty>=0.0.1a10"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
