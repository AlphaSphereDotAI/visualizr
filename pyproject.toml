[project]
name = "visualizr"
description = "Video Generator part of the Chatacter Backend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10.0, <3.11"
dependencies = [
    "espnet>=202207",
    "gradio[mcp]>=5.42.0",
    "huggingface-hub[hf-xet]>=0.34.4",
    "loguru>=0.7.3",
    "moviepy>=2.2.1",
    "numpy>=1.26.3,<2.0.0",
    "python-speech-features>=0.6",
    "pytorch-lightning>=2.3.3",
    "realesrgan>=0.3.0",
    "torch>=2.0.0,<2.1.0",
    "torchaudio>=2.0.2,<2.1.0",
    "torchvision>=0.15.2,<0.15.3",
    "transformers>=4.55.2",
]

[project.scripts]
visualizr = "visualizr.__main__:main"

[[tool.uv.index]]
explicit = true
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

